services:
  chat:
    image: ghcr.io/instyo/tiny-agent-chat:latest
    container_name: tiny-agent-chat
    stdin_open: true
    tty: true
    init: true
    environment:
      OPENAI_API_KEY: CHANGE_ME
      OPENAI_BASE_URL: CHANGE_ME
      TAVILY_API_KEY: CHANGE_ME
      ANVIA_MEMORY_PATH: /app/data/anvia-memory.sqlite
      NODE_ENV: production
      CHAT_SESSION_ID: default
      CHAT_USER_ID: local
    volumes:
      - /DATA/AppData/tiny-agent-chat/data:/app/data
    working_dir: /app
    command: ["sleep", "infinity"]
    restart: unless-stopped
